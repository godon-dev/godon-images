<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>godon — Connectome Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#010204;font-family:ui-monospace,monospace;color:#567}
#view{display:block;width:100vw;height:100vh;cursor:grab}
#view:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.bracket{position:absolute;width:12px;height:12px;border:1px solid rgba(80,160,255,.2)}
.bracket.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.bracket.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.bracket.bl{bottom:8px;left:8px;border-right:0;border-top:0}
.bracket.br{bottom:8px;right:8px;border-left:0;border-top:0}
#title{position:absolute;top:16px;left:24px}
#title .main{font-size:11px;letter-spacing:6px;color:#90c0ff;text-shadow:0 0 10px rgba(80,160,255,.2)}
#title .sub{font-size:7px;letter-spacing:2px;margin-top:3px;color:#22384a}
#phase-display{position:absolute;top:16px;right:24px;text-align:right}
#phase-display .lbl{font-size:6px;letter-spacing:2px;color:#22384a}
#phase-display .val{font-size:12px;letter-spacing:3px;margin-top:2px;font-weight:600;transition:color .5s}
#stats{position:absolute;bottom:42px;left:24px;font-size:7px;letter-spacing:1px;color:#22384a;line-height:1.8}
#stats .v{color:#567;font-weight:600}
#hint{position:absolute;bottom:14px;right:24px;font-size:7px;letter-spacing:2px;color:#16242e;text-align:right}
#replay{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);pointer-events:auto;background:rgba(2,4,8,.5);backdrop-filter:blur(6px);border:1px solid rgba(80,160,255,.12);color:#3a6a90;font-family:inherit;font-size:7px;letter-spacing:3px;padding:5px 14px;cursor:pointer;transition:.3s}
#replay:hover{background:rgba(80,160,255,.06);border-color:rgba(80,160,255,.25);color:#6a9ac8}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
<div class="bracket tl"></div><div class="bracket tr"></div><div class="bracket bl"></div><div class="bracket br"></div>
<div id="title"><div class="main">GODON</div><div class="sub">CONNECTOME SCANNER · LIVE</div></div>
<div id="phase-display"><div class="lbl">ACTIVE PROBE</div><div class="val" id="pval">INIT</div></div>
<div id="stats">
EDGES: <span class="v" id="ec">0</span> · CYCLE: <span class="v" id="cc">1</span><br>
CONFIDENCE: <span class="v">95%</span> · PFA: <span class="v">0.05</span>
</div>
<div id="hint">DRAG ORBIT · SCROLL ZOOM</div>
<button id="replay">RESET CONNECTOME</button>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

let T=0;
const cv=document.getElementById('view');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.7;R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x010204,.007);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,300);cam.position.set(20,14,30);
const oc=new OrbitControls(cam,R.domElement);oc.target.set(0,5,0);oc.enableDamping=true;oc.dampingFactor=.05;oc.minDistance=12;oc.maxDistance=80;oc.autoRotate=true;oc.autoRotateSpeed=.2;
const comp=new EffectComposer(R);comp.addPass(new RenderPass(scene,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,.75,.08));
scene.add(new THREE.AmbientLight(0x081420,.5));scene.add(new THREE.HemisphereLight(0x152840,0x080010,.3));

// Dust
{const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*120;p[i*3+1]=Math.random()*35-5;p[i*3+2]=(Math.random()-.5)*120}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x152535,size:.05,transparent:true,opacity:.35,blending:THREE.AdditiveBlending})))}

function lerp(a,b,t){return a+(b-a)*t}

// ═══════════════════════════════════════════════════════════════
// ZONE 0: GODON ENGINE (top center, y~20)
// ═══════════════════════════════════════════════════════════════
const enginePos=new THREE.Vector3(0,20,0);
const engineGrp=new THREE.Group();engineGrp.position.copy(enginePos);scene.add(engineGrp);

// Engine core — geometric mandala frame
const engineCoreMat=new THREE.MeshStandardMaterial({color:0x0a1422,emissive:0x0a2240,emissiveIntensity:.3,roughness:.3,metalness:.8,flatShading:true,transparent:true,opacity:.8});
const engineCore=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),engineCoreMat);engineGrp.add(engineCore);

// Engine rings — orbiting, representing orchestration
const engineRings=[];
for(let i=0;i<3;i++){
    const m=new THREE.MeshBasicMaterial({color:0x2a5a8a,transparent:true,opacity:.3,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(2+i*.7,.03,4,48),m);
    ring.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
    engineGrp.add(ring);engineRings.push({ring,mat:m,sp:.002+Math.random()*.003,axis:new THREE.Vector3(Math.random(),Math.random(),Math.random()).normalize()});
}

// Engine glow
const engGlowMat=new THREE.MeshBasicMaterial({color:0x1a3a5a,transparent:true,opacity:.06,blending:THREE.AdditiveBlending});
engineGrp.add(new THREE.Mesh(new THREE.SphereGeometry(3,16,16),engGlowMat));

// Control beams — thin lines from engine down to each breeder (orchestration)
const ctrlBeams=[];
for(let i=0;i<4;i++){
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
    const m=new THREE.LineBasicMaterial({color:0x1a3a5a,transparent:true,opacity:.1,blending:THREE.AdditiveBlending});
    const line=new THREE.Line(geo,m);scene.add(line);
    ctrlBeams.push({line,m,opacity:.1});
}

// ═══════════════════════════════════════════════════════════════
// ZONE 0b: HUMAN/PILOT (above engine, y~26)
// ═══════════════════════════════════════════════════════════════
const pilotPos=new THREE.Vector3(0,26,0);
const pilotGrp=new THREE.Group();pilotGrp.position.copy(pilotPos);scene.add(pilotGrp);

// Pilot — abstract presence (torus knot, representing human intelligence)
const pilotMat=new THREE.MeshStandardMaterial({color:0x4a8aff,emissive:0x2a4a8a,emissiveIntensity:.5,roughness:.2,metalness:.8,flatShading:true,transparent:true,opacity:.6});
const pilotCore=new THREE.Mesh(new THREE.TorusKnotGeometry(.5,.15,64,8),pilotMat);pilotGrp.add(pilotCore);

// Pilot glow
pilotGrp.add(new THREE.Mesh(new THREE.SphereGeometry(1.2,16,16),new THREE.MeshBasicMaterial({color:0x2a5a9a,transparent:true,opacity:.05,blending:THREE.AdditiveBlending})));

// Pilot → engine beam (oversight)
{
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([0,0,0, 0,-5,0]),3));
    const m=new THREE.LineBasicMaterial({color:0x2a4a7a,transparent:true,opacity:.15,blending:THREE.AdditiveBlending});
    pilotGrp.add(new THREE.Line(geo,m));
}

// ═══════════════════════════════════════════════════════════════
// ZONE 1: INFRASTRUCTURE + BREEDERS (y = -2 to +6)
// ═══════════════════════════════════════════════════════════════
const Z1Y=-1;
const targets=[];
const TP=[[-7,0,-3],[7,1,-1],[-3,-1,5],[5,-2,4]];
for(let i=0;i<4;i++){
    const g=new THREE.Group();g.position.set(TP[i][0],Z1Y+TP[i][1],TP[i][2]);
    // Core
    const cm=new THREE.MeshStandardMaterial({color:0x152030,emissive:0x0a1525,emissiveIntensity:.15,roughness:.5,metalness:.7,flatShading:true,transparent:true,opacity:.7});
    const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.0,1),cm);g.add(core);
    // Inner glow
    const gm=new THREE.MeshBasicMaterial({color:0x2a4060,transparent:true,opacity:.05,blending:THREE.AdditiveBlending});
    g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),gm));
    // Guardrail shell — the safety boundary
    const grMat=new THREE.MeshBasicMaterial({color:0x1a3a2a,wireframe:true,transparent:true,opacity:.06,side:THREE.BackSide});
    const guard=new THREE.Mesh(new THREE.IcosahedronGeometry(1.8,1),grMat);g.add(guard);
    // Orbit ring
    const rm=new THREE.MeshBasicMaterial({color:0x223a52,transparent:true,opacity:.15});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.02,4,32),rm);ring.rotation.set(Math.random()*3,Math.random()*3,0);g.add(ring);
    scene.add(g);
    targets.push({g,pos:g.position.clone(),core,coreMat:cm,glowMat:gm,guard,grMat,ring,ringMat:rm,curCol:new THREE.Color(0x152030),idleCol:new THREE.Color(0x152030),pulseScl:1,guardHit:0});
}

// Breeders
const breeders=[];const BC=[0x4a9eff,0xff66aa,0x66ff99,0xffaa44];
for(let i=0;i<4;i++){
    const g=new THREE.Group();const a=i/4*Math.PI*2;
    g.position.copy(targets[i].pos);g.position.x+=Math.cos(a)*2.2;g.position.z+=Math.sin(a)*2.2;
    const col=BC[i];const mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.7,roughness:.1,metalness:.9,flatShading:true});
    const cr=new THREE.Mesh(new THREE.OctahedronGeometry(.35,0),mat);g.add(cr);
    const sm=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.08,side:THREE.BackSide,blending:THREE.AdditiveBlending});
    g.add(new THREE.Mesh(new THREE.OctahedronGeometry(.6,0),sm));scene.add(g);
    breeders.push({g,cr,mat,shellMat:sm,baseCol:new THREE.Color(col),curCol:new THREE.Color(col),tgtCol:new THREE.Color(col),rotS:.005,tgtRot:.005,scl:1,tgtScl:1,target:i,orbA:a,orbR:2.2,state:'optimize',label:'B'+(i+1)});
}

// ── Impulse stream ────────────────────────────────────────────
const ringPool=[];
for(let i=0;i<24;i++){const m=new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
const r=new THREE.Mesh(new THREE.RingGeometry(.25,.45,32),m);r.rotation.x=-Math.PI/2;r.visible=false;scene.add(r);ringPool.push({r,m,active:false,rad:.2,op:0})}
function ping(pos,col){for(let i of ringPool)if(!i.active){i.active=true;i.r.visible=true;i.r.position.copy(pos);i.rad=.15;i.op=.6;if(col)i.m.color.setHex(col);return}}

// ── Signal pulse ──────────────────────────────────────────────
const sigs=[];
function signal(from,to,col){const m=new THREE.MeshBasicMaterial({color:col||0xff6600,transparent:true,opacity:.7,blending:THREE.AdditiveBlending});
const s=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),m);s.position.copy(from);scene.add(s);sigs.push({s,m,from:from.clone(),to:to.clone(),t:0})}

// ── Detection flash ───────────────────────────────────────────
const flashes=[];
function flash(pos,col){const m=new THREE.MeshBasicMaterial({color:col||0xffcc00,transparent:true,opacity:.8,blending:THREE.AdditiveBlending});
const f=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),m);f.position.copy(pos);scene.add(f);flashes.push({f,m,t:0})}

// ── Spark to connectome ───────────────────────────────────────
const sparks=[];
function spark(from,to,cb){const m=new THREE.MeshBasicMaterial({color:0xffcc44,transparent:true,opacity:.9,blending:THREE.AdditiveBlending});
const s=new THREE.Mesh(new THREE.SphereGeometry(.1,6,6),m);s.position.copy(from);scene.add(s);sparks.push({s,m,from:from.clone(),to:to.clone(),t:0,cb})}

// ── Measurement beam (breeder scanning receiver target) ───────
const measBeams=[];
function measBeam(from,to){const geo=new THREE.BufferGeometry();
const fp=from.clone(),tp=to.clone();geo.setFromPoints([fp,tp]);
const m=new THREE.LineBasicMaterial({color:0x00ff88,transparent:true,opacity:.3,blending:THREE.AdditiveBlending});
const line=new THREE.Line(geo,m);scene.add(line);measBeams.push({line,m,t:0})}

// ═══════════════════════════════════════════════════════════════
// ZONE 2: CONNECTOME CONSTRUCT (y = 10 to 16)
// ═══════════════════════════════════════════════════════════════
const CC=new THREE.Vector3(0,13,0);const CR=3.5;
const connSphere=new THREE.Mesh(new THREE.IcosahedronGeometry(CR,2),new THREE.MeshBasicMaterial({color:0x0a1a2a,wireframe:true,transparent:true,opacity:.06}));
connSphere.position.copy(CC);scene.add(connSphere);
const connGlow=new THREE.Mesh(new THREE.SphereGeometry(CR*.65,16,16),new THREE.MeshBasicMaterial({color:0x152535,transparent:true,opacity:.03,blending:THREE.AdditiveBlending}));
connGlow.position.copy(CC);scene.add(connGlow);

const connNodes=[];const connEdges=[];let edgeCount=0;
const ecountEl=document.getElementById('ec');const cycleEl=document.getElementById('cc');
const connNP=[];
for(let i=0;i<4;i++){const phi=Math.acos(1-2*(i+.5)/4);const theta=Math.PI*(1+Math.sqrt(5))*i;const r=CR*.55;
connNP.push(new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta)).add(CC))}
for(let i=0;i<4;i++){
    // Node
    const m=new THREE.MeshBasicMaterial({color:0xffcc44,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
    const node=new THREE.Mesh(new THREE.SphereGeometry(.18,12,12),m);node.position.copy(connNP[i]);scene.add(node);
    // Label
    const c=document.createElement('canvas');c.width=128;c.height=32;const cx=c.getContext('2d');
    cx.fillStyle='rgba(255,204,68,.7)';cx.font='bold 18px monospace';cx.textAlign='center';cx.fillText('T'+(i+1),64,22);
    const tex=new THREE.CanvasTexture(c);const lm=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0});
    const lbl=new THREE.Mesh(new THREE.PlaneGeometry(.6,.15),lm);lbl.position.copy(connNP[i]);lbl.position.y+=.4;scene.add(lbl);
    connNodes.push({mesh:node,mat:m,lblMat:lm,revealed:false,pulse:0});
}
function addConnEdge(a,b){
    const ex=connEdges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));if(ex)return false;
    const mid=CC.clone().lerp(connNP[a].clone().lerp(connNP[b],.5),.15);
    const cv=new THREE.QuadraticBezierCurve3(connNP[a],mid,connNP[b]);const pts=cv.getPoints(15);
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const m=new THREE.LineBasicMaterial({color:0xffcc44,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
    const line=new THREE.Line(geo,m);scene.add(line);
    connEdges.push({line,mat:m,a,b,appearT:0});edgeCount++;ecountEl.textContent=edgeCount;return true;
}

// ═══════════════════════════════════════════════════════════════
// PROTOCOL STATE MACHINE
// ═══════════════════════════════════════════════════════════════
const pVal=document.getElementById('pval');
const PCOL={optimize:'#4a9eff',coordinate:'#00ff88',push:'#ff3300',signal:'#ff8800',measure:'#00ffaa',detect:'#ffcc00',connectome:'#ffcc44'};
let cIdx=0,cStart=0,lastPh='';
const CDUR=8500;
const PAIRS=[[0,1],[1,2],[2,3],[0,2],[1,3],[0,3],[1,0],[2,1],[3,2],[2,0],[3,1],[3,0]];
let isPushing=false,pushTarget=0,impT=0,sigT=0,measT=0;
let guardHit=0;

function phAt(ms){
    if(ms<400)return'optimize';if(ms<1100)return'coordinate';if(ms<3600)return'push';
    if(ms<4400)return'signal';if(ms<5800)return'measure';if(ms<7200)return'detect';
    if(ms<8400)return'connectome';return'optimize';
}

function updateProtocol(){
    const el=T-cStart;const pair=PAIRS[cIdx%PAIRS.length];const snd=pair[0],rcv=pair[1];
    const ph=phAt(el);

    // PUSH — continuous impulse stream from breeder into target, coupling signals out
    if(ph==='push'){
        if(!isPushing){
            isPushing=true;pushTarget=breeders[snd].target;
            breeders[snd].tgtCol.setHex(0xff1100);breeders[snd].tgtRot=.04;breeders[snd].tgtScl=1.5;breeders[snd].state='push';
            targets[pushTarget].curCol.lerp(new THREE.Color(0xff3300),.8);targets[pushTarget].pulseScl=1;
            breeders[rcv].tgtCol.setHex(0x00ff88);breeders[rcv].tgtRot=.001;breeders[rcv].tgtScl=.85;breeders[rcv].state='hold';
        }
        // Impulse stream from breeder
        impT+=16;if(impT>160){impT=0;ping(breeders[snd].g.position.clone(),0xff3300);targets[pushTarget].pulseScl=1.25}
        // Coupling signal stream from sender target → receiver target
        sigT+=16;if(sigT>250){sigT=0;signal(targets[breeders[snd].target].pos,targets[breeders[rcv].target].pos,0xff5500)}
        // Guardrail shimmer — occasionally hits the boundary
        guardHit+=16;if(guardHit>800){guardHit=0;targets[pushTarget].guardHit=1}
    }else if(isPushing){isPushing=false;impT=0;sigT=0;guardHit=0}

    // SIGNAL — main coupling pulse
    // MEASURE — receiver breeder scanning receiver target
    if(ph==='measure'){
        measT+=16;if(measT>200){measT=0;measBeam(breeders[rcv].g.position.clone(),targets[breeders[rcv].target].pos.clone())}
    }

    if(ph!==lastPh){
        lastPh=ph;pVal.textContent=ph.toUpperCase();pVal.style.color=PCOL[ph]||'#666';pVal.style.textShadow='0 0 8px '+(PCOL[ph]||'#666')+'44';
        cycleEl.textContent=Math.floor(cIdx/PAIRS.length)+1;

        if(ph==='optimize'){for(let b of breeders){b.tgtCol.copy(b.baseCol);b.tgtRot=.005;b.tgtScl=1;b.state='optimize'}}
        if(ph==='coordinate'){breeders[snd].tgtCol.setHex(0xff4400);breeders[snd].tgtRot=.02;breeders[snd].tgtScl=1.3;
        breeders[rcv].tgtCol.setHex(0x00ff88);breeders[rcv].tgtRot=.002;breeders[rcv].tgtScl=.85}
        if(ph==='signal'){signal(targets[breeders[snd].target].pos,targets[breeders[rcv].target].pos,0xff6600)}
        if(ph==='measure'){breeders[rcv].tgtCol.setHex(0x00ffaa);breeders[rcv].tgtRot=.015;breeders[rcv].tgtScl=1.1}
        if(ph==='detect'){
            flash(targets[breeders[rcv].target].pos);breeders[rcv].tgtCol.setHex(0xffcc00);breeders[rcv].tgtRot=.03;breeders[rcv].tgtScl=1.3;
            spark(targets[breeders[rcv].target].pos.clone(),connNP[rcv].clone(),()=>{
                if(!connNodes[snd].revealed){connNodes[snd].revealed=true;connNodes[snd].pulse=1;connNodes[snd].lblMat.opacity=.7}
                if(!connNodes[rcv].revealed){connNodes[rcv].revealed=true;connNodes[rcv].pulse=1;connNodes[rcv].lblMat.opacity=.7}
                addConnEdge(snd,rcv);
            });
        }
        if(ph==='connectome'){for(let b of breeders){b.tgtCol.copy(b.baseCol);b.tgtRot=.005;b.tgtScl=1}}
    }
    if(el>CDUR){cIdx++;cStart=T;lastPh='';isPushing=false}
}

document.getElementById('replay').onclick=()=>{
    for(let e of connEdges)scene.remove(e.line);connEdges.length=0;edgeCount=0;ecountEl.textContent='0';
    for(let n of connNodes){n.revealed=false;n.mat.opacity=0;n.pulse=0;n.lblMat.opacity=0}
    cIdx=0;cStart=T;lastPh='';
};

// ═══ RENDER LOOP ══════════════════════════════════════════════
function animate(){
    requestAnimationFrame(animate);
    T=performance.now();oc.update();updateProtocol();

    // Godon engine
    engineCore.rotation.y+=.002;engineCore.rotation.x+=.001;
    for(let r of engineRings){r.ring.rotateOnAxis(r.axis,r.sp)}
    engGlowMat.opacity=.04+Math.sin(T*.001)*.02;
    // Control beams from engine to breeders
    for(let i=0;i<4;i++){
        const p=ctrlBeams[i].line.geometry.attributes.position.array;
        p[0]=enginePos.x;p[1]=enginePos.y;p[2]=enginePos.z;
        p[3]=breeders[i].g.position.x;p[4]=breeders[i].g.position.y;p[5]=breeders[i].g.position.z;
        ctrlBeams[i].line.geometry.attributes.position.needsUpdate=true;
        // Brighter for active breeders
        ctrlBeams[i].m.opacity=lerp(ctrlBeams[i].m.opacity,breeders[i].state==='push'?.3:.08,.05);
        ctrlBeams[i].m.color.copy(breeders[i].curCol);
    }

    // Pilot
    pilotCore.rotation.y+=.003;pilotCore.rotation.z+=.002;
    pilotMat.emissiveIntensity=.4+Math.sin(T*.0015)*.15;

    // Breeders
    for(let b of breeders){
        b.curCol.lerp(b.tgtCol,.05);b.mat.color.copy(b.curCol);b.mat.emissive.copy(b.curCol);b.shellMat.color.copy(b.curCol);
        b.scl=lerp(b.scl,b.tgtScl,.05);b.g.scale.setScalar(b.scl);b.rotS=lerp(b.rotS,b.tgtRot,.05);
        b.cr.rotation.y+=b.rotS;b.cr.rotation.x+=b.rotS*.4;b.orbA+=b.rotS*.4;
        const t=targets[b.target];
        b.g.position.x=t.pos.x+Math.cos(b.orbA)*b.orbR;b.g.position.z=t.pos.z+Math.sin(b.orbA)*b.orbR;
        b.g.position.y=t.pos.y+Math.sin(b.orbA*1.3)*b.orbR*.4;
    }

    // Targets — react, guardrails
    for(let t of targets){
        t.curCol.lerp(t.idleCol,.02);t.coreMat.emissive.copy(t.curCol);
        t.coreMat.emissiveIntensity=.15+Math.sin(T*.002+t.pos.x)*.06;
        t.glowMat.color.copy(t.curCol);t.ring.rotation.z+=.004;t.ring.rotation.x+=.002;
        t.g.children[0].rotation.y+=.001;
        if(t.pulseScl>1){t.pulseScl=lerp(t.pulseScl,1,.08);t.g.scale.setScalar(t.pulseScl)}else{t.g.scale.setScalar(1)}
        // Guardrail shimmer
        if(t.guardHit>0){t.guardHit*=.92;t.grMat.opacity=lerp(.06,.3,t.guardHit);t.grMat.color.setHex(0xff4400)}else{t.grMat.opacity=lerp(t.grMat.opacity,.06,.05);t.grMat.color.lerp(new THREE.Color(0x1a3a2a),.05)}
    }

    // Impulses
    for(let i of ringPool)if(i.active){i.rad+=.1;i.op*=.95;i.r.scale.setScalar(i.rad);i.m.opacity=i.op;if(i.op<.01){i.active=false;i.r.visible=false}}

    // Signals
    for(let i=sigs.length-1;i>=0;i--){const s=sigs[i];s.t+=.03;if(s.t>=1){scene.remove(s.s);sigs.splice(i,1)}else{s.s.position.lerpVectors(s.from,s.to,s.t);s.m.opacity=.7*(1-s.t*.5)}}

    // Flashes
    for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.t+=.025;f.f.scale.setScalar(1+f.t*5);f.m.opacity=Math.max(0,.8-f.t*1.5);if(f.t>1){scene.remove(f.f);flashes.splice(i,1)}}

    // Measurement beams
    for(let i=measBeams.length-1;i>=0;i--){const b=measBeams[i];b.t+=.02;b.m.opacity=Math.max(0,.3-b.t*.3);if(b.t>1){scene.remove(b.line);measBeams.splice(i,1)}}

    // Sparks
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=.02;if(s.t>=1){scene.remove(s.s);if(s.cb)s.cb();sparks.splice(i,1)}else{const yB=Math.sin(s.t*Math.PI)*3;s.s.position.lerpVectors(s.from,s.to,s.t);s.s.position.y+=yB;s.m.opacity=.9*(1-s.t*.3)}}

    // Connectome
    connSphere.rotation.y+=.0008;connSphere.rotation.x+=.0004;connGlow.rotation.y-=.0005;
    for(let n of connNodes){if(n.revealed){n.mat.opacity=lerp(n.mat.opacity,.7,.05);if(n.pulse>0){n.pulse*=.9;n.mesh.scale.setScalar(1+n.pulse*2)}else{n.mesh.scale.setScalar(1+Math.sin(T*.003)*.1)}}}
    for(let e of connEdges){if(e.appearT<2){e.appearT+=.015;e.mat.opacity=Math.min(.55,e.appearT*.35)}else{e.mat.opacity=Math.sin(T*.002+e.appearT)*.1+.45}}

    comp.render();
}

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight)});
cStart=performance.now();animate();
</script>
</body>
</html>
