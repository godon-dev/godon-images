name: Rust Mutants

# The test-discrimination instrument for the images' rust crates:
# cargo-mutants breaks each crate in small ways and checks its suite
# notices. All nine suites run on fakes — no database needed.
#
# Weekly + manual dispatch — a measurement run, not a per-PR gate.
# Outcomes land as one artifact; the kill rate is the watched trend.

on:
  workflow_dispatch:
  schedule:
    # weekly, Monday 04:30 UTC — after the cli run
    - cron: '30 4 * * 1'

env:
  CRATES: images/godon-api images/godon-bench-generic images/godon-bench-greenhouse images/godon-bench-microgrid images/godon-causal images/godon-mcp images/godon-observer images/godon-seeder shared/ledger-reader

jobs:
  mutants:
    name: cargo mutants (all image crates)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Baseline (every suite must be green before breaking it)
        run: |
          for m in $CRATES; do
            echo "::group::test $m"
            (cd "$m" && cargo test --quiet)
            echo "::endgroup::"
          done

      - name: cargo mutants
        run: |
          for m in $CRATES; do
            n=$(basename "$m")
            echo "::group::mutants $m"
            (cd "$m" && cargo mutants --output "../mutants.out/$n")
            echo "::endgroup::"
          done

      - name: Upload outcomes
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: mutants.out/
