name: Build and Test godon-robots

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'images/godon-robots/**'
      - 'build/**'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Robots version to test against (X.Y.Z)'
        required: false
        default: '0.180.2'

env:
  IMAGE_NAME: godon-robots

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get robots version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.VERSION }}" ]; then
          VERSION="${{ github.event.inputs.VERSION }}"
          echo "Using provided VERSION: $VERSION"
        else
          # PINNED, not resolved: the latest-tag resolver would find python-era
          # tags (the 0.170.x line carries no flake). The rust line opened at
          # 0.180.0 by the holder's word - a ten-minor leap from 0.170.x, the
          # era marker (minors are organ epochs in this estate; the gap is the
          # leap he asked for); 0.180.2 carries the self-serve door (WM_JOB_PATH
          # routing + get_job_args) the one-line headers pin. Restore the
          # resolver (latest release of godon-dev/godon-robots, as
          # godon-cli-ci.yml does) once further rust releases exist.
          VERSION="0.180.2"
          echo "Using pinned VERSION: $VERSION (the rust line)"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Build godon-robots container
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        export VERSION=${{ env.VERSION }}
        export IMAGE_NAME=${{ env.IMAGE_NAME }}
        export PROJECT_ROOT="$(git rev-parse --show-toplevel)"
        cd images/godon-robots
        bash ../../build/build-container-nix.sh --builder-file ../../build/Dockerfile.nix-builder

    - name: Test container invocation
      run: |
        echo "Testing godon-robots container (unknown component, expect the loud refusal)..."
        VERSION="${{ steps.version.outputs.VERSION }}"

        # Unknown component: the platform env the dispatch deps read is
        # faked (construction is offline); the refusal is the component
        # dispatch itself - stderr text, exit code 1.
        set +e
        OUTPUT=$(docker run --rm \
          -e BASE_INTERNAL_URL=http://smoke.invalid \
          -e WM_TOKEN=smoke-token \
          -e WM_WORKSPACE=smoke \
          ${{ env.IMAGE_NAME }}:$VERSION smoke_unknown_component '{}' 2>&1)
        RC=$?
        set -e
        echo "$OUTPUT"
        [ "$RC" -eq 1 ] || { echo "unexpected exit code: $RC (want 1)"; exit 1; }
        echo "$OUTPUT" | grep -F 'unknown component "smoke_unknown_component"'
        echo "$OUTPUT" | grep -F 'worker | recon-http | recon-prometheus | effectuation-http | effectuation-ssh'

        # No argv at all: the usage line, exit code 2.
        set +e
        USAGE=$(docker run --rm ${{ env.IMAGE_NAME }}:$VERSION 2>&1)
        RC=$?
        set -e
        echo "$USAGE"
        [ "$RC" -eq 2 ] || { echo "unexpected exit code: $RC (want 2)"; exit 1; }
        echo "$USAGE" | grep -F 'usage: godon-engine'

        echo "✅ Container tests passed"

    - name: Show container info
      run: |
        echo "=== Container Information ==="
        VERSION="${{ steps.version.outputs.VERSION }}"
        docker images ${{ env.IMAGE_NAME }}:$VERSION
        echo ""
        echo "=== Container size (the size-budget receipt) ==="
        docker image inspect ${{ env.IMAGE_NAME }}:$VERSION --format 'size bytes: {{.Size}}'
        echo ""
        echo "=== Container layers (top 10) ==="
        docker history ${{ env.IMAGE_NAME }}:$VERSION --human | head -10
