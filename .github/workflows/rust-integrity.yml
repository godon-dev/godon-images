name: Rust Integrity

# The boring tier for the images' rust crates: cargo fmt and cargo clippy
# across all nine (eight images plus the shared ledger reader) — cheap
# signals ahead of the per-image container builds.
#
# The mutants job is the test-discrimination instrument, looped over
# the same nine crates (dispatch/weekly only — measurement, not a gate;
# every suite runs on fakes, no database needed).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'images/**'
      - 'shared/**'
      - '.github/workflows/rust-integrity.yml'
  workflow_dispatch:
  schedule:
    # weekly, Monday 04:30 UTC — after the cli run
    - cron: '30 4 * * 1'

env:
  CRATES: images/godon-api images/godon-bench-generic images/godon-bench-greenhouse images/godon-bench-microgrid images/godon-causal images/godon-mcp images/godon-observer images/godon-seeder shared/ledger-reader

jobs:
  fmt-and-clippy:
    if: github.event_name == 'pull_request'
    name: cargo fmt + cargo clippy (all crates)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: cargo fmt
        run: |
          rustup component add rustfmt
          for m in $CRATES; do
            echo "::group::fmt $m"
            (cd "$m" && cargo fmt --check)
            echo "::endgroup::"
          done

      - name: cargo clippy
        run: |
          rustup component add clippy
          for m in $CRATES; do
            echo "::group::clippy $m"
            (cd "$m" && cargo clippy --all-targets -- -D warnings)
            echo "::endgroup::"
          done

  mutants:
    if: github.event_name != 'pull_request'
    name: cargo mutants (all image crates)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Baseline (every suite must be green before breaking it)
        run: |
          for m in $CRATES; do
            echo "::group::test $m"
            (cd "$m" && cargo test --quiet)
            echo "::endgroup::"
          done

      - name: cargo mutants
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mutants.out"
          for m in $CRATES; do
            n=$(basename "$m")
            echo "::group::mutants $m"
            # absolute path: each crate's ".." resolves differently
            (cd "$m" && cargo mutants --output "$GITHUB_WORKSPACE/mutants.out/$n") \
              || echo "$m: mutants reported misses or failed — outcomes in artifact if present"
            echo "::endgroup::"
          done
          echo "crates with outcomes:"
          ls "$GITHUB_WORKSPACE/mutants.out" || true

      - name: Ratchet — every crate above its declared floor
        # The kill-rate floors: whole-percent minima per crate, set a
        # few points UNDER each fresh measurement so run-to-run wobble
        # never trips them (margin 3; microgrid 6, the one crate with
        # a measured wobble band). Below floor = red, and red is a
        # real regression, not noise. An incomplete measurement (a
        # crate with no outcomes) is red too — a receipt that never
        # arrived cannot pass.
        if: always()
        run: |
          declare -A FLOORS=(
            [godon-api]=21
            [godon-bench-generic]=61
            [godon-bench-greenhouse]=68
            [godon-bench-microgrid]=85
            [godon-causal]=32
            [godon-mcp]=53
            [godon-observer]=50
            [godon-seeder]=50
            [ledger-reader]=93
          )
          fail=0
          for m in $CRATES; do
            n=$(basename "$m")
            o="$GITHUB_WORKSPACE/mutants.out/$n/mutants.out/outcomes.json"
            if [ ! -f "$o" ]; then
              echo "::error::$n has no outcomes — the measurement is incomplete"
              fail=1
              continue
            fi
            caught=$(jq -r '.caught' "$o" 2>/dev/null) || true
            missed=$(jq -r '.missed' "$o" 2>/dev/null) || true
            # fail closed: unreadable outcomes are red, never "no viable"
            if ! [[ "$caught" =~ ^[0-9]+$ && "$missed" =~ ^[0-9]+$ ]]; then
              echo "::error::$n outcomes unreadable — the measurement is broken"
              fail=1
              continue
            fi
            viable=$((caught + missed))
            if [ "$viable" -eq 0 ]; then
              echo "$n: no viable mutants — no floor applies"
              continue
            fi
            pct=$(( 100 * caught / viable ))
            floor=${FLOORS[$n]}
            if [ "$pct" -lt "$floor" ]; then
              echo "::error::$n kill-rate ${pct}% is BELOW its floor ${floor}%"
              fail=1
            else
              echo "$n: ${pct}% (floor ${floor}%)"
            fi
          done
          exit $fail

      - name: Upload outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: mutants.out/
