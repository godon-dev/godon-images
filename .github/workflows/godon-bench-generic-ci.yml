name: Godon Bench Generic CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'images/godon-bench-generic/**'
      - 'build/**'
      - '.github/workflows/godon-bench-generic-ci.yml'
  workflow_dispatch:

env:
  NIXPKGS_CHANNEL: https://nixos.org/channels/nixos-25.05

jobs:
  build-and-test:
    name: Build and Test Container
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=https://nixos.org/channels/nixos-25.05

    - name: Build godon-bench-generic container with Nix
      run: |
        cd images/godon-bench-generic
        PROJECT_ROOT="$(git rev-parse --show-toplevel)" \
        ../../build/build-container-nix.sh \
          --version "test-${{ github.run_number }}" \
          --name "godon-bench-generic-test" \
          --builder-file ../../build/Dockerfile.nix-builder

    - name: Start container with default config
      run: |
        docker run -d --name bench-test \
          -p 8090:8090 \
          -e PORT=8090 \
          godon-bench-generic-test:test-${{ github.run_number }}

        sleep 3

        if ! docker ps | grep bench-test; then
          echo "Container failed to start"
          docker logs bench-test
          exit 1
        fi

    - name: Test /health endpoint
      run: curl -sf http://localhost:8090/health || { echo "/health failed"; docker logs bench-test; exit 1; }

    - name: Test /config endpoint
      run: curl -sf http://localhost:8090/config | grep -q "nodes" || { echo "/config failed"; docker logs bench-test; exit 1; }

    - name: Test /node-1/apply endpoint
      run: |
        curl -sf -X POST http://localhost:8090/node-1/apply \
          -H "Content-Type: application/json" \
          -d '{"param_0": 50.0, "param_1": 50.0, "param_2": 50.0}' | grep -q "objective_0" || { echo "/apply failed"; exit 1; }

    - name: Test /node-1/status endpoint
      run: curl -sf http://localhost:8090/node-1/status | grep -q "node-1" || { echo "/status failed"; exit 1; }

    - name: Test cross-node coupling visible on read
      run: |
        # Sender applies params; receiver (never re-applied) must read the
        # coupled value on GET. Regression guard for stale stored reads:
        # node-1 obj0 at params 100,100,100 = 0.3+0.5+0.2 = 1.0;
        # node-2 objective_0 must then read ~0.7 (edge 0.7), NOT ~0.
        curl -sf -X POST http://localhost:8090/node-1/apply \
          -H "Content-Type: application/json" \
          -d '{"param_0": 100.0, "param_1": 100.0, "param_2": 100.0}' > /dev/null
        V=$(curl -sf http://localhost:8090/node-2/metrics/json | jq -r '.objective_0')
        echo "node-2 objective_0 after node-1 apply: ${V}"
        awk -v v="${V}" 'BEGIN { if (v > 0.5) exit 0; print "FAIL: expected ~0.7 (coupled), got " v; exit 1 }'

    - name: Container cleanup
      if: always()
      run: |
        docker stop bench-test || true
        docker rm bench-test || true
        docker rmi godon-bench-generic-test:test-${{ github.run_number }} || true
