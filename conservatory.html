<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CONSERVATORY — Botanical Facility</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050608; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfd6cc; }
  #view { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #view:active { cursor: grabbing; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .bracket { position: absolute; width: 18px; height: 18px; border: 1px solid rgba(180,220,170,0.45); }
  .bracket.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .bracket.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
  #title-block { position: absolute; top: 26px; left: 32px; }
  .title-main { font-size: 22px; letter-spacing: 6px; font-weight: 600; color: #eaf4e0; text-shadow: 0 0 12px rgba(120,180,120,0.4); }
  .title-sub  { font-size: 10px; letter-spacing: 3px; margin-top: 6px; color: #9fb89a; opacity: 0.85; }
  .title-tag  { font-size: 9px;  letter-spacing: 2px; margin-top: 3px; color: #7d9b7a; opacity: 0.65; }
  #deck {
    position: absolute; bottom: 28px; left: 32px;
    pointer-events: auto;
    background: rgba(8,14,10,0.55); backdrop-filter: blur(10px);
    padding: 16px 20px; border: 1px solid rgba(140,180,130,0.25);
    max-width: 340px;
  }
  .deck-title { font-size: 10px; letter-spacing: 3px; color: #b6d4ac; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .row label { font-size: 10px; letter-spacing: 1.5px; color: #9fb89a; min-width: 92px; }
  .row input[type=range] { flex: 1; accent-color: #8fc27f; height: 3px; }
  .row .val { font-size: 10px; color: #d6e6c8; min-width: 46px; text-align: right; }
  #hint {
    position: absolute; bottom: 32px; right: 32px;
    font-size: 10px; letter-spacing: 2px; color: #8aa684; opacity: 0.7;
    text-align: right; line-height: 1.7;
  }
  #hint .hk { color: #d6e6c8; }
  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at center, #1a2820 0%, #050608 100%);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: opacity 1.6s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .intro-kicker { font-size: 10px; letter-spacing: 4px; color: #6e8a6a; margin-bottom: 18px; }
  .intro-title { font-size: 44px; letter-spacing: 14px; font-weight: 200; color: #eaf4e0; }
  .intro-quote { font-size: 11px; letter-spacing: 2px; color: #8aa684; margin-top: 24px; font-style: italic; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="bracket tl"></div><div class="bracket tr"></div>
  <div class="bracket bl"></div><div class="bracket br"></div>
  <div id="title-block">
    <div class="title-main">CONSERVATORY</div>
    <div class="title-sub">BOTANICAL FACILITY · MEADOW · TWO HOUSES</div>
    <div class="title-tag">PBR GLASS // 3D PAVERS // PROCEDURAL FLORA // STAFF</div>
  </div>
  <div id="deck">
    <div class="deck-title">ENVIRONMENT</div>
    <div class="row"><label>HOUR</label><input id="hour" type="range" min="5" max="21" step="0.1" value="7.5"/><span class="val" id="hour-val">07:30</span></div>
    <div class="row"><label>GROWTH</label><input id="growth" type="range" min="0.02" max="1" step="0.01" value="0.02"/><span class="val" id="growth-val">2%</span></div>
    <div class="row"><label>WORKERS</label><input id="workers" type="range" min="0" max="6" step="1" value="6"/><span class="val" id="workers-val">6</span></div>
    <div class="row"><label>WIND</label><input id="wind" type="range" min="0" max="2" step="0.05" value="1"/><span class="val" id="wind-val">1.00</span></div>
    <div class="row"><label>GOD RAYS</label><input id="rays" type="range" min="0" max="2.5" step="0.05" value="1.3"/><span class="val" id="rays-val">1.30</span></div>
    <div class="row"><label>BLOOM</label><input id="bloom" type="range" min="0" max="2.0" step="0.05" value="0.7"/><span class="val" id="bloom-val">0.70</span></div>
    <div class="row"><label>EXPOSURE</label><input id="exp" type="range" min="0.3" max="1.6" step="0.01" value="0.95"/><span class="val" id="exp-val">0.95</span></div>
  </div>
  <div id="hint"><span class="hk">DRAG</span> ORBIT &nbsp;·&nbsp; <span class="hk">SCROLL</span> ZOOM<br>WATCH THE GARDENERS AT WORK</div>
</div>
<div id="intro">
  <div class="intro-kicker">VOLUMETRIC GLASSHOUSE — REAL-TIME PBR</div>
  <div class="intro-title">CONSERVATORY</div>
  <div class="intro-quote">"green is the colour of her growing things"</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 800);
camera.position.set(28, 14, 32);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI * 0.495;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.9;

const sky = new Sky();
sky.scale.setScalar(1000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 8;
skyU.rayleigh.value = 2.2;
skyU.mieCoefficient.value = 0.005;
skyU.mieDirectionalG.value = 0.82;

const sunLight = new THREE.DirectionalLight(0xfff0d0, 3.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 180;
sunLight.shadow.camera.left = -45;
sunLight.shadow.camera.right = 45;
sunLight.shadow.camera.top = 45;
sunLight.shadow.camera.bottom = -45;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.03;
scene.add(sunLight);
scene.add(sunLight.target);

const hemi = new THREE.HemisphereLight(0xb8d9ff, 0x4a3a20, 0.6);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x4a5566, 0.25);
scene.add(amb);

const sun = new THREE.Vector3();
let sunElevation = 14;
let sunAzimuth = 132;
function updateSun() {
  const phi = THREE.MathUtils.degToRad(90 - sunElevation);
  const theta = THREE.MathUtils.degToRad(sunAzimuth);
  sun.setFromSphericalCoords(1, phi, theta);
  skyU.sunPosition.value.copy(sun);
  sunLight.position.copy(sun).multiplyScalar(80);
  sunLight.target.position.set(0, 0, 0);
  sunLight.target.updateMatrixWorld();
  const warm = Math.min(1, Math.max(0, (25 - Math.abs(sunElevation - 8)) / 25));
  sunLight.color.setRGB(1.0, 0.88 + 0.08 * warm, 0.70 + 0.18 * (1 - warm));
  sunLight.intensity = 1.6 + 2.4 * Math.max(0, Math.sin(Math.max(0, sunElevation) * Math.PI / 180));
  skyU.turbidity.value = 6 + 6 * warm;
  skyU.rayleigh.value = 1.0 + 3.0 * warm;
}
updateSun();

const sharedGLSL = `
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
               mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
  }
  float fbm(vec2 p){
    float v = 0.0; float a = 0.5;
    for(int i=0;i<4;i++){ v += a*vnoise(p); p *= 2.07; a *= 0.5; }
    return v;
  }
`;

const meadowMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    varying vec3 vW;
    ${sharedGLSL}
    void main(){
      vec2 p = vW.xz;
      float n1 = fbm(p * 0.16);
      float n2 = fbm(p * 0.55 + 50.0);
      float n3 = vnoise(p * 3.5);
      vec3 paleGreen = vec3(0.42, 0.55, 0.22);
      vec3 deepGreen = vec3(0.15, 0.30, 0.10);
      vec3 dryYellow = vec3(0.58, 0.55, 0.25);
      vec3 col = mix(deepGreen, paleGreen, n1);
      col = mix(col, dryYellow, smoothstep(0.55, 0.85, n2) * 0.55);
      col *= 0.82 + 0.34 * n3;
      float fn = fbm(p * 7.5);
      float flowerSpot = smoothstep(0.86, 0.93, fn);
      float ft = fbm(p * 0.7);
      vec3 fWhite = vec3(1.0, 0.98, 0.88);
      vec3 fRed  = vec3(0.85, 0.32, 0.28);
      vec3 fPurple = vec3(0.65, 0.42, 0.85);
      vec3 fYellow = vec3(0.95, 0.82, 0.25);
      vec3 flowerCol = mix(fWhite, fRed, smoothstep(0.25, 0.32, ft));
      flowerCol = mix(flowerCol, fPurple, smoothstep(0.50, 0.57, ft));
      flowerCol = mix(flowerCol, fYellow, smoothstep(0.75, 0.82, ft));
      col = mix(col, flowerCol, flowerSpot * 0.9);
      float dist = length(p);
      col *= 1.0 - 0.08 * smoothstep(40.0, 90.0, dist);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const meadow = new THREE.Mesh(new THREE.PlaneGeometry(400, 400, 1, 1), meadowMat);
meadow.rotation.x = -Math.PI / 2;
meadow.position.y = -0.02;
meadow.receiveShadow = true;
scene.add(meadow);

const BUILDINGS = [
  { x: -7, z: 0, hw: 11.5, hd: 5.5 },
  { x: 17, z: 0, hw: 6.5, hd: 4.5 },
];
function isInBuilding(x, z) {
  for (const b of BUILDINGS) {
    if (Math.abs(x - b.x) < b.hw + 0.5 && Math.abs(z - b.z) < b.hd + 0.5) return true;
  }
  return false;
}

const PATHS = [
  { x: 0,   z: -60, dx: 0, dz: 1, len: 47, w: 6 },
  { x: -32, z: -13, dx: 1, dz: 0, len: 64, w: 5 },
  { x: -13, z: -13, dx: 0, dz: 1, len: 8,  w: 2 },
  { x: -7,  z: -13, dx: 0, dz: 1, len: 8,  w: 2 },
  { x: -1,  z: -13, dx: 0, dz: 1, len: 8,  w: 2 },
  { x: 17,  z: -13, dx: 0, dz: 1, len: 9,  w: 2 },
];
function isOnPath(x, z) {
  for (const p of PATHS) {
    const vx = x - p.x, vz = z - p.z;
    const along = vx * p.dx + vz * p.dz;
    const perp = vx * (-p.dz) + vz * p.dx;
    if (along < -0.5 || along > p.len + 0.5) continue;
    if (Math.abs(perp) < p.w / 2 + 0.5) return true;
  }
  return false;
}

function makeTuftGeometry() {
  const blades = [];
  const H = 0.55;
  for (let i = 0; i < 5; i++) {
    const g = new THREE.PlaneGeometry(0.06, H);
    g.translate(0, H / 2, 0);
    g.rotateY((i / 5) * Math.PI + Math.random() * 0.3);
    blades.push(g);
  }
  return mergeGeometries(blades);
}
const tuftGeo = makeTuftGeometry();
const tuftMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 1, metalness: 0, side: THREE.DoubleSide,
});
const tuftShaderRef = { shader: null };
tuftMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uWind = { value: 1.0 };
  shader.vertexShader = 'uniform float uTime;\nuniform float uWind;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `
    vec3 transformed = vec3(position);
    float h = position.y;
    vec4 wpos = modelMatrix * instanceMatrix * vec4(position, 1.0);
    float sway = sin(uTime * 1.4 + wpos.x * 0.35 + wpos.z * 0.45) * 0.10 * h * uWind;
    float sway2 = cos(uTime * 1.1 + wpos.x * 0.22 - wpos.z * 0.38) * 0.07 * h * uWind;
    transformed.x += sway;
    transformed.z += sway2;
    `
  );
  tuftShaderRef.shader = shader;
};
const TUFT_COUNT = 9000;
const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, TUFT_COUNT);
const _m = new THREE.Matrix4();
const _pos = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _scl = new THREE.Vector3();
const _euler = new THREE.Euler();
const _col = new THREE.Color();
let tuftIdx = 0;
function tryTuft(x, z) {
  if (tuftIdx >= TUFT_COUNT) return;
  if (isOnPath(x, z) || isInBuilding(x, z)) return;
  _pos.set(x, 0, z);
  _euler.set(0, Math.random() * Math.PI * 2, 0);
  _quat.setFromEuler(_euler);
  const s = 0.7 + Math.random() * 1.3;
  _scl.set(s, s * (0.85 + Math.random() * 0.4), s);
  _m.compose(_pos, _quat, _scl);
  tufts.setMatrixAt(tuftIdx, _m);
  const l = 0.16 + Math.random() * 0.16;
  if (Math.random() < 0.18) _col.setHSL(0.10, 0.45, 0.30 + Math.random() * 0.08);
  else                      _col.setHSL(0.22 + Math.random() * 0.07, 0.60 + Math.random() * 0.15, l);
  tufts.setColorAt(tuftIdx, _col);
  tuftIdx++;
}
for (let i = 0; i < TUFT_COUNT * 3; i++) {
  const r = 4 + Math.random() * 60;
  const a = Math.random() * Math.PI * 2;
  tryTuft(Math.cos(a) * r, Math.sin(a) * r);
  if (tuftIdx >= TUFT_COUNT) break;
}
tufts.instanceMatrix.needsUpdate = true;
if (tufts.instanceColor) tufts.instanceColor.needsUpdate = true;
tufts.castShadow = true;
tufts.receiveShadow = true;
scene.add(tufts);

const flowerHeadGeo = new THREE.ConeGeometry(0.07, 0.18, 6);
const flowerHeadMat = new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0 });
const FLOWER_COUNT = 700;
const flowerHeads = new THREE.InstancedMesh(flowerHeadGeo, flowerHeadMat, FLOWER_COUNT);
const flowerPalette = [
  new THREE.Color(1.00, 0.98, 0.88),
  new THREE.Color(0.95, 0.82, 0.25),
  new THREE.Color(0.85, 0.32, 0.28),
  new THREE.Color(0.65, 0.42, 0.85),
  new THREE.Color(1.00, 0.55, 0.70),
];
let flowerIdx = 0;
for (let i = 0; i < FLOWER_COUNT * 4 && flowerIdx < FLOWER_COUNT; i++) {
  const r = 6 + Math.random() * 55;
  const a = Math.random() * Math.PI * 2;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (isOnPath(x, z) || isInBuilding(x, z)) continue;
  _pos.set(x, 0.18 + Math.random() * 0.05, z);
  _euler.set(0, Math.random() * Math.PI * 2, 0);
  _quat.setFromEuler(_euler);
  const s = 0.7 + Math.random() * 0.8;
  _scl.set(s, s, s);
  _m.compose(_pos, _quat, _scl);
  flowerHeads.setMatrixAt(flowerIdx, _m);
  flowerHeads.setColorAt(flowerIdx, flowerPalette[flowerIdx % flowerPalette.length]);
  flowerIdx++;
}
flowerHeads.instanceMatrix.needsUpdate = true;
if (flowerHeads.instanceColor) flowerHeads.instanceColor.needsUpdate = true;
scene.add(flowerHeads);

const paverGeo = new THREE.BoxGeometry(0.92, 0.16, 0.92);
const paverMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 });
const PAVER_COUNT = 800;
const pavers = new THREE.InstancedMesh(paverGeo, paverMat, PAVER_COUNT);
let paverIdx = 0;
function pave(originX, originZ, dirX, dirZ, length, width) {
  const cols = Math.floor(length / 1.0);
  const rows = Math.floor(width / 1.0);
  const perpX = -dirZ, perpZ = dirX;
  for (let c = 0; c < cols && paverIdx < PAVER_COUNT; c++) {
    for (let r = 0; r < rows && paverIdx < PAVER_COUNT; r++) {
      const cx = -width/2 + r * 1.0 + 0.5 + (Math.random() - 0.5) * 0.06;
      const cl = c * 1.0 + 0.5 + (Math.random() - 0.5) * 0.06;
      const x = originX + dirX * cl + perpX * cx;
      const z = originZ + dirZ * cl + perpZ * cx;
      const y = 0.08 + (Math.random() - 0.5) * 0.03;
      _pos.set(x, y, z);
      _euler.set(0, (Math.random() - 0.5) * 0.14, 0);
      _quat.setFromEuler(_euler);
      _scl.set(1, 1, 1);
      _m.compose(_pos, _quat, _scl);
      pavers.setMatrixAt(paverIdx, _m);
      _col.setHSL(0.08 + Math.random() * 0.04, 0.18 + Math.random() * 0.12, 0.36 + Math.random() * 0.18);
      pavers.setColorAt(paverIdx, _col);
      paverIdx++;
    }
  }
}
for (const p of PATHS) pave(p.x, p.z, p.dx, p.dz, p.len, p.w);
pavers.instanceMatrix.needsUpdate = true;
if (pavers.instanceColor) pavers.instanceColor.needsUpdate = true;
pavers.castShadow = true;
pavers.receiveShadow = true;
scene.add(pavers);

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xeef6ee, metalness: 0, roughness: 0.04,
  transmission: 1, thickness: 0.08, ior: 1.5,
  transparent: true, side: THREE.DoubleSide,
  clearcoat: 0.4, clearcoatRoughness: 0.08,
  attenuationColor: new THREE.Color(0xbfe2c8), attenuationDistance: 10,
  envMapIntensity: 0.9,
});
const frameMat = new THREE.MeshStandardMaterial({
  color: 0x20271f, roughness: 0.45, metalness: 0.88,
  envMapIntensity: 0.6,
});
const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 0.85, metalness: 0 });

const floorMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uCausticStrength: { value: 0.85 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    precision highp float;
    uniform float uTime; uniform float uCausticStrength;
    varying vec3 vW;
    ${sharedGLSL}
    float caustic(vec2 p){
      float t = uTime * 0.45;
      float c = 0.0;
      for(int i=0;i<4;i++){
        float fi = float(i);
        vec2 q = p + vec2(sin(t + fi*1.7 + p.y*2.1), cos(t*1.2 + fi + p.x*1.8)) * 0.55;
        float n = fbm(q * 1.8 + fi * 1.3);
        c += 1.0 / (1.0 + 22.0 * pow(abs(n - 0.5), 1.8));
      }
      return c / 4.0;
    }
    void main(){
      vec2 tuv = vW.xz * 0.85;
      vec2 tid = floor(tuv);
      float th = hash(tid);
      vec3 stone = mix(vec3(0.20, 0.18, 0.155), vec3(0.32, 0.29, 0.24), th);
      vec2 f = fract(tuv);
      float grout = max(
        smoothstep(0.94, 1.0, f.x) + smoothstep(0.0, 0.06, f.x),
        smoothstep(0.94, 1.0, f.y) + smoothstep(0.0, 0.06, f.y)
      );
      stone *= mix(1.0, 0.45, clamp(grout, 0.0, 1.0));
      stone *= 0.78 + 0.42 * vnoise(vW.xz * 9.0);
      float cau = caustic(vW.xz * 0.55);
      vec3 cauCol = vec3(1.0, 0.95, 0.74) * cau * uCausticStrength;
      vec3 col = stone + cauCol;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const UP = new THREE.Vector3(0, 1, 0);

function buildGreenhouse(cfg) {
  const g = new THREE.Group();
  g.position.set(cfg.x, 0, cfg.z);
  scene.add(g);
  const W = cfg.W, D = cfg.D, H = cfg.H, RH = cfg.RH;
  const hw = W / 2, hd = D / 2;

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.02;
  floor.receiveShadow = true;
  g.add(floor);

  function beam(a, b, t = 0.08) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
    const geo = new THREE.BoxGeometry(t, len, t);
    const mesh = new THREE.Mesh(geo, frameMat);
    mesh.position.copy(mid);
    mesh.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
  }
  function glassPane(pa, pb, y0, y1) {
    const width = pa.distanceTo(pb);
    const height = y1 - y0;
    const mid = pa.clone().lerp(pb, 0.5);
    mid.y = (y0 + y1) / 2;
    const geo = new THREE.PlaneGeometry(width, height);
    const mesh = new THREE.Mesh(geo, glassMat);
    mesh.position.copy(mid);
    const wd = new THREE.Vector3().subVectors(pb, pa).normalize();
    const n = new THREE.Vector3().crossVectors(wd, UP).normalize();
    mesh.lookAt(mid.clone().add(n));
    g.add(mesh);
  }
  function glassQuad(a, b, c, d) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z,
      a.x,a.y,a.z, c.x,c.y,c.z, d.x,d.y,d.z,
    ]), 3));
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, glassMat));
  }
  function glassTri(a, b, c) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z,
    ]), 3));
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, glassMat));
  }

  const c000 = new THREE.Vector3(-hw, 0, -hd), c100 = new THREE.Vector3( hw, 0, -hd);
  const c001 = new THREE.Vector3(-hw, 0,  hd), c101 = new THREE.Vector3( hw, 0,  hd);
  const c010 = new THREE.Vector3(-hw, H, -hd), c110 = new THREE.Vector3( hw, H, -hd);
  const c011 = new THREE.Vector3(-hw, H,  hd), c111 = new THREE.Vector3( hw, H,  hd);
  const ap0  = new THREE.Vector3(-hw, H + RH, 0);
  const ap1  = new THREE.Vector3( hw, H + RH, 0);

  beam(c000, c010, 0.11); beam(c100, c110, 0.11);
  beam(c001, c011, 0.11); beam(c101, c111, 0.11);
  beam(c000, c100, 0.10); beam(c100, c101, 0.10);
  beam(c101, c001, 0.10); beam(c001, c000, 0.10);
  beam(c010, c110, 0.10); beam(c110, c111, 0.10);
  beam(c111, c011, 0.10); beam(c011, c010, 0.10);
  beam(ap0, ap1, 0.13);
  beam(c010, ap0, 0.09); beam(c110, ap1, 0.09);
  beam(c011, ap0, 0.09); beam(c111, ap1, 0.09);

  glassQuad(c010, c110, ap1, ap0);
  glassQuad(c111, c011, ap0, ap1);
  glassTri(c010, c011, ap0);
  glassTri(c111, c110, ap1);

  function buildWall(side, doors) {
    let a, b;
    if (side === 'south') { a = c000.clone(); b = c100.clone(); }
    else if (side === 'north') { a = c101.clone(); b = c001.clone(); }
    else if (side === 'east')  { a = c100.clone(); b = c101.clone(); }
    else                       { a = c001.clone(); b = c000.clone(); }
    const wallLen = a.distanceTo(b);
    const doorList = doors.slice().sort((p, q) => p.pos - q.pos);
    const segs = [];
    let cur = -1;
    for (const d of doorList) {
      const half = d.width / wallLen;
      const ds = d.pos - half, de = d.pos + half;
      if (ds > cur) segs.push({ start: cur, end: ds, door: false });
      segs.push({ start: ds, end: de, door: true });
      cur = de;
    }
    if (cur < 1) segs.push({ start: cur, end: 1, door: false });
    const mullSpacing = 2.6;
    for (const s of segs) {
      const sa = a.clone().lerp(b, (s.start + 1) / 2);
      const sb = a.clone().lerp(b, (s.end + 1) / 2);
      if (s.door) {
        const dh = Math.min(H * 0.62, 2.6);
        beam(sa, sa.clone().setY(H), 0.06);
        beam(sb, sb.clone().setY(H), 0.06);
        beam(sa.clone().setY(dh), sb.clone().setY(dh), 0.06);
        glassPane(sa, sb, dh, H);
      } else {
        const segLen = sa.distanceTo(sb);
        const n = Math.max(1, Math.round(segLen / mullSpacing));
        for (let i = 0; i < n; i++) {
          const t0 = i / n, t1 = (i + 1) / n;
          const pa = sa.clone().lerp(sb, t0);
          const pb = sa.clone().lerp(sb, t1);
          glassPane(pa, pb, 0, H);
          if (i > 0) beam(pa, pa.clone().setY(H), 0.045);
        }
      }
    }
    beam(a.clone().setY(H * 0.5), b.clone().setY(H * 0.5), 0.04);
    const longMullions = Math.max(2, Math.round(wallLen / 2.6));
    for (let i = 1; i < longMullions; i++) {
      const t = i / longMullions;
      const p = a.clone().lerp(b, t);
      beam(p, p.clone().setY(H), 0.04);
    }
  }
  buildWall('south', cfg.doors.south || []);
  buildWall('north', cfg.doors.north || []);
  buildWall('east',  cfg.doors.east  || []);
  buildWall('west',  cfg.doors.west  || []);

  return { group: g, W, D, H, RH, hw, hd };
}

function makeLeafGeometry(length = 1, width = 0.28) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(width, length * 0.32, width * 0.9, length * 0.78, 0, length);
  s.bezierCurveTo(-width * 0.9, length * 0.78, -width, length * 0.32, 0, 0);
  return new THREE.ShapeGeometry(s, 8);
}
function makePot(radius = 0.55, height = 0.65, color = 0x8b5a3c) {
  const m = new THREE.Mesh(

  );

}

function makeBush(flowerColor = null) {

function makeTallPlant() {
  const g = new THREE.Group();
  const stemH = 2.3;

    new THREE.CylinderGeometry(0.05, 0.07, stemH, 6),
    new THREE.MeshStandardMaterial({ color: 0x4a6a30, roughness: 0.85 })
  );

  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4d8a3a, roughness: 0.75, side: THREE.DoubleSide });
  const N = 28;
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = (i / N) * stemH;
    const r = 0.06 + Math.sin((i / N) * Math.PI) * 0.42;

    const leaf = new THREE.Mesh(leafGeo, leafMat);

    leaf.rotation.x = -Math.PI * 0.5 + Math.sin(a) * 0.2;
    leaf.rotation.z = Math.cos(a) * 0.4;

  const tip = new THREE.Mesh(

    new THREE.MeshStandardMaterial({ color: 0xffd060, emissive: 0xff9020, emissiveIntensity: 0.18, roughness: 0.5 })
  );

}
function place(factoryOrPlant, x, z, potR = 0.6, potH = 0.7, scale = 1, delay = 0) {

  registerPlant(plant, scale, delay);
}

    ag.add(upper);
    const hand = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 6, 4),
      new THREE.MeshStandardMaterial({ color: c.skin, roughness: 0.7 })
    );
    hand.position.y = -0.55;
    ag.add(hand);
    g.add(ag);
    return ag;
  }
  const leftArm = makeArm(-1);
  const rightArm = makeArm(1);

  function makeLeg(side) {
    const lg = new THREE.Group();
    lg.position.set(side * 0.10, hipY, 0);
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.05, 0.85, 6),
      new THREE.MeshStandardMaterial({ color: c.pants, roughness: 0.85 })
    );
    leg.position.y = -0.42;
    leg.castShadow = true;
    lg.add(leg);
    g.add(lg);
    return lg;
  }
  const leftLeg = makeLeg(-1);
  const rightLeg = makeLeg(1);

  g.userData = { leftArm, rightArm, leftLeg, rightLeg, torso, head };
  return g;
}

const workers = [];
const workerConfigs = [
  { x: -14, z: 0, r: 2.2, speed: 0.40, phase: 0.0 },
  { x:  -7, z: 0, r: 2.0, speed: -0.32, phase: 1.6 },
  { x:   0, z: 0, r: 2.5, speed: 0.45, phase: 3.1 },
  { x:  14, z: -1, r: 1.6, speed: 0.50, phase: 0.4 },
  { x:  17, z: 1.5, r: 1.4, speed: -0.38, phase: 2.2 },
  { x:  20, z: 0, r: 1.7, speed: 0.42, phase: 4.0 },
];
for (let i = 0; i < workerConfigs.length; i++) {
  const w = makeWorker(i);
  scene.add(w);
  w.userData.config = workerConfigs[i];
  workers.push(w);
}
let workersVisible = 6;
function updateWorkers(t) {
  for (let i = 0; i < workers.length; i++) {
    const w = workers[i];
    if (i >= workersVisible) { w.visible = false; continue; }
    w.visible = true;
    const c = w.userData.config;
    const angle = t * c.speed + c.phase;
    const x = c.x + Math.cos(angle) * c.r;
    const z = c.z + Math.sin(angle) * c.r;
    w.position.set(x, 0, z);
    const dirSign = Math.sign(c.speed);
    const tx = -Math.sin(angle) * dirSign;
    const tz = Math.cos(angle) * dirSign;
    w.rotation.y = Math.atan2(tx, tz);
    const sw = Math.sin(t * 7 + c.phase) * 0.4;
    w.userData.leftLeg.rotation.x = sw;
    w.userData.rightLeg.rotation.x = -sw;
    w.userData.leftArm.rotation.x = -sw * 0.7;
    w.userData.rightArm.rotation.x = sw * 0.7;
    const bob = Math.abs(Math.sin(t * 7 + c.phase)) * 0.025;
    w.userData.torso.position.y = (0.85 + 1.42) / 2 + bob;
    w.userData.head.position.y = 1.42 + 0.15 + bob;
  }
}

const dustCount = 2200;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustSeed = new Float32Array(dustCount);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3 + 0] = -7 + (Math.random() - 0.5) * 22;
  dustPos[i * 3 + 1] = Math.random() * 8.2;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 10;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dustSeed.map(() => Math.random() * 100), 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) },
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aSeed;
    uniform float uTime; uniform float uPixelRatio; uniform vec3 uSunDir;
    varying float vBright;
    void main(){
      vec3 p = position;
      p.x += sin(uTime * 0.30 + aSeed) * 0.55;
      p.y += cos(uTime * 0.22 + aSeed * 1.3) * 0.35 + sin(uTime * 0.15 + aSeed) * 0.22;
      p.z += sin(uTime * 0.27 + aSeed * 0.7) * 0.55;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uPixelRatio * (2.2 + mod(aSeed, 2.4)) * (10.0 / max(0.5, -mv.z));
      float beam = max(0.0, dot(normalize(vec3(-p.x, 1.0, -p.z)), uSunDir));
      vBright = (0.25 + 0.75 * beam) * (0.5 + 0.5 * sin(uTime * 1.2 + aSeed * 3.0));
    }
  `,
  fragmentShader: `
    varying float vBright;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      float a = smoothstep(0.5, 0.0, r);
      a = a * a;
      gl_FragColor = vec4(vec3(1.0, 0.95, 0.78), a * vBright * 0.55);
    }
  `,
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  type: THREE.HalfFloatType, samples: 2,
});
const composer = new EffectComposer(renderer, renderTarget);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.6, 1.5
);
composer.addPass(bloomPass);
const godRaysPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null },
    uSunScreen: { value: new THREE.Vector2(0.5, 0.5) },
    uIntensity: { value: 1.3 },
    uAspect: { value: window.innerWidth / window.innerHeight },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tDiffuse; uniform vec2 uSunScreen; uniform float uIntensity; uniform float uAspect;
    varying vec2 vUv;
    void main(){
      const int N = 64;
      vec2 sun = uSunScreen;
      vec2 toSun = sun - vUv; toSun.x *= uAspect;
      float distToSun = length(toSun);
      vec2 step_ = (sun - vUv) / float(N);
      vec2 pos = vUv;
      float illum = 0.0;
      float decay = 1.0;
      for (int i = 0; i < N; i++) {
        pos += step_;
        vec3 s = texture2D(tDiffuse, pos).rgb;
        float b = max(s.r, max(s.g, s.b));
        float mask = smoothstep(1.0, 2.4, b);
        illum += mask * decay;
        decay *= 0.97;
      }
      illum /= float(N);
      vec3 base = texture2D(tDiffuse, vUv).rgb;
      float falloff = exp(-distToSun * 1.6);
      vec3 rays = vec3(1.0, 0.92, 0.74) * illum * uIntensity * falloff;
      gl_FragColor = vec4(base + rays, 1.0);
    }
  `,
}));
composer.addPass(godRaysPass);
composer.addPass(new OutputPass());

const hourEl = document.getElementById('hour');
const hourVal = document.getElementById('hour-val');
const growthEl = document.getElementById('growth');
const growthVal = document.getElementById('growth-val');
const workersEl = document.getElementById('workers');
const workersVal = document.getElementById('workers-val');
const windEl = document.getElementById('wind');
const windVal = document.getElementById('wind-val');
const raysEl = document.getElementById('rays');
const raysVal = document.getElementById('rays-val');
const bloomEl = document.getElementById('bloom');
const bloomVal = document.getElementById('bloom-val');
const expEl = document.getElementById('exp');
const expVal = document.getElementById('exp-val');

function fmtHour(h) {
  const hh = Math.floor(h);
  const mm = Math.floor((h - hh) * 60);
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
function applyHour(h) {
  hourVal.textContent = fmtHour(h);
  const dn = Math.max(0, Math.min(1, (h - 6) / 12));
  sunElevation = Math.sin(dn * Math.PI) * 58 - 10;
  sunAzimuth = 90 + dn * 180;
  updateSun();
}

let growthManual = false;
let growthStartT = 0;
const GROWTH_DUR = 7.0;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
function applyGrowthValue(v) {
  growthVal.textContent = Math.round(v * 100) + '%';
  for (const p of plants) p.scale.setScalar(v * p.userData.baseScale);
}
function updateAutoGrowth(elapsed) {
  if (growthManual) return;
  let overall = 0;
  for (const p of plants) {
    const lt = Math.max(0, Math.min(1, (elapsed - growthStartT - p.userData.delay) / GROWTH_DUR));
    const lg = 0.02 + 0.98 * easeOutCubic(lt);
    p.scale.setScalar(lg * p.userData.baseScale);
    overall = Math.max(overall, lg);
  }
  growthEl.value = overall;
  growthVal.textContent = Math.round(overall * 100) + '%';
}

hourEl.addEventListener('input', () => applyHour(parseFloat(hourEl.value)));
expEl.addEventListener('input', () => {
  renderer.toneMappingExposure = parseFloat(expEl.value);
  expVal.textContent = parseFloat(expEl.value).toFixed(2);
});
raysEl.addEventListener('input', () => { raysVal.textContent = parseFloat(raysEl.value).toFixed(2); });
bloomEl.addEventListener('input', () => {
  const v = parseFloat(bloomEl.value);
  bloomPass.strength = v;
  bloomVal.textContent = v.toFixed(2);
});
growthEl.addEventListener('input', () => {
  growthManual = true;
  applyGrowthValue(parseFloat(growthEl.value));
});
workersEl.addEventListener('input', () => {
  workersVisible = parseInt(workersEl.value, 10);
  workersVal.textContent = workersVisible;
});
if (windEl) {
  windEl.addEventListener('input', () => {
    const v = parseFloat(windEl.value);
    windVal.textContent = v.toFixed(2);
    if (tuftShaderRef.shader) tuftShaderRef.shader.uniforms.uWind.value = v;
  });
}
for (const el of [raysEl, bloomEl, expEl, workersEl]) el.dispatchEvent(new Event('input'));
applyHour(parseFloat(hourEl.value));

function resize() {
  const w_ = window.innerWidth, h_ = window.innerHeight;
  renderer.setSize(w_, h_);
  composer.setSize(w_, h_);
  bloomPass.setSize(w_, h_);
  camera.aspect = w_ / h_;
  camera.updateProjectionMatrix();
  godRaysPass.uniforms.uAspect.value = w_ / h_;
  dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
const _v = new THREE.Vector3();
const _forward = new THREE.Vector3();
growthStartT = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  controls.update();
  if (camera.position.y < 0.4) camera.position.y = 0.4;
  meadowMat.uniforms.uTime.value = t;
  floorMat.uniforms.uTime.value = t;
  if (tuftShaderRef.shader) tuftShaderRef.shader.uniforms.uTime.value = t;
  dustMat.uniforms.uTime.value = t;
  dustMat.uniforms.uSunDir.value.copy(sun);
  updateAutoGrowth(t);
  updateWorkers(t);
  camera.getWorldDirection(_forward);
  _v.copy(sun).sub(camera.position).normalize();
  const sunFacing = Math.max(0, _v.dot(_forward));
  const ndc = sun.clone().project(camera);
  godRaysPass.uniforms.uSunScreen.value.set(ndc.x * 0.5 + 0.5, ndc.y * 0.5 + 0.5);
  godRaysPass.uniforms.uIntensity.value = parseFloat(raysEl.value) * Math.max(0.05, sunFacing);
  composer.render();
  requestAnimationFrame(animate);
}
setTimeout(() => { document.getElementById('intro').classList.add('hide'); }, 700);
animate();
</script>
